<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Don Rafael's Coffee</title>

<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">

<style>

/* ===== FULL-SCREEN PHOTO BACKGROUND ===== */

body {

margin: 0;

font-family: Arial, sans-serif;

background-image:
linear-gradient(
rgba(0, 0, 0, 0.40),
rgba(0, 0, 0, 0.40)
),
url("alexis-antonio-qoOUxBVJGE0-unsplash.jpg");

background-size: cover;

background-position: center;

background-repeat: no-repeat;

background-attachment: fixed;

display: flex;

justify-content: center;

align-items: center;

min-height: 100vh;

text-align: center;

}


/* ===== TOP CTA ===== */

.quote-button {

position: fixed;

top: 25px;

right: 25px;

background-color: #4EA5D9;

color: white;

text-decoration: none;

padding: 12px 22px;

border-radius: 12px;

font-weight: 700;

font-size: 14px;

box-shadow: 0 6px 18px rgba(0,0,0,.18);

transition: all 0.25s ease;

}

.quote-button:hover {

background-color: #2f8cc5;

transform: translateY(-3px);

}


/* ===== CENTER CONTENT ===== */

.container {

max-width: 720px;

padding: 20px;

}


/* ===== BRAND NAME ===== */

h1 {

font-family: "Lobster", cursive;

font-size: 78px;

color: #ffffff;

margin: 0;

letter-spacing: 0.5px;

text-shadow: 0 4px 16px rgba(0,0,0,0.45);

}


/* ===== TAGLINE ===== */

.tagline {

font-size: 21px;

color: #ffffff;

margin-top: 12px;

margin-bottom: 6px;

font-weight: 500;

text-shadow: 0 2px 10px rgba(0,0,0,0.45);

}


/* ===== SERVICE POSITIONING ===== */

.subline {

font-size: 14px;

color: #ffffff;

margin-bottom: 34px;

letter-spacing: 1px;

text-transform: uppercase;

text-shadow: 0 2px 8px rgba(0,0,0,0.45);

}


/* ===== PRIMARY CTA ===== */

.cta-button {

display: inline-block;

padding: 14px 30px;

background-color: #c1121f;

color: white;

text-decoration: none;

font-size: 16px;

border-radius: 12px;

font-weight: 700;

transition: all 0.25s ease;

box-shadow: 0 6px 18px rgba(0,0,0,0.25);

}


.cta-button:hover {

background-color: #a50f19;

transform: translateY(-3px);

}


/* ===== MOBILE ===== */

@media (max-width: 768px) {

body {

background-attachment: scroll;

background-position: center center;

}

h1 {

font-size: 56px;

}

.quote-button {

top: 15px;

right: 15px;

padding: 10px 16px;

}

.tagline {

font-size: 18px;

}

.subline {

font-size: 12px;

}

}

</style>

</head>


<body>


<!-- TOP RIGHT CTA -->

<a

class="quote-button"

href="https://app.flashquotes.com/f/nusxmt"

target="_blank"

>

Get Your Custom Quote

</a>


<!-- CENTER CONTENT -->

<div class="container">

<h1>Don Rafael's</h1>

<div class="tagline">South Florida's Puerto Rican Coffee</div>

<div class="subline">Mobile Coffee • Events • Experiences</div>

<a

class="cta-button"

href="https://instagram.com/donrafaelscoffee"

target="_blank"

>

Cafecito y la Familia!

</a>

</div>


</body>

</html>
